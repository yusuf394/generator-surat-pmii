<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Surat PMII Rayon PBSI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f4f9;--card:#fff;--tx:#1b2433;--mut:#5d6b82;--bd:#cfd8e6;--pri:#1f4e9c;--err:#c0392b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2230;--tx:#e8edf6;--mut:#9aa8bf;--bd:#34405a;--pri:#6c9bf0;--err:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2230;--tx:#e8edf6;--mut:#9aa8bf;--bd:#34405a;--pri:#6c9bf0;--err:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
.wrap{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
label small{font-weight:400;color:var(--mut)}
.req::after{content:" *";color:var(--err)}
input[type=text],input[type=number],input[type=date],input[type=file]{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
input:focus{outline:2px solid var(--pri);outline-offset:1px}
.step{display:flex;gap:8px}.step input{text-align:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
.step button{width:44px;font-size:18px}
.pri{background:var(--pri);color:#fff;border-color:var(--pri);width:100%;font-weight:600;padding:12px;font-size:15px}
.pri:disabled{opacity:.6;cursor:wait}
.sg{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.sg .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.sg .hd button{padding:3px 9px;font-size:12px}
.err{color:var(--err);font-size:13px;margin:8px 0 0;min-height:1em}
.pv{overflow:hidden;background:#fff;border:1px solid var(--bd);border-radius:6px}
.pvh{font-size:13px;color:var(--mut);margin:0 0 8px}
/* ===== Kertas surat (A4 @96dpi) ===== */
.paper{width:794px;height:1120px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;position:relative;overflow:hidden;transform-origin:top left}
.kop{display:flex;align-items:flex-start;padding:28px 36px 0 62px}
.kop img{width:92px;height:auto;margin-top:6px;margin-right:6px}
.kt{flex:1;text-align:center;color:#2b4f8c;font-weight:700;line-height:1.18}
.kt .a{font-size:17px}.kt .b{font-size:16.5px}.kt .c{font-size:12px;font-style:italic;font-weight:400;margin-left:30px}
.kt .d{font-size:16.5px}.kt .e{font-size:11.5px;font-weight:400;color:#2b4f8c;margin-top:3px}
.kt .a,.kt .b{font-family:Arial,sans-serif}
.line{margin:8px 0 0 62px;width:calc(100% - 100px);height:5px;background:#1f3a73;box-shadow:0 5px 0 -1px #808080}
.body{padding:20px 90px 0 108px}
.meta td{padding:0;vertical-align:top}.meta td:first-child{width:115px}
.body{line-height:1.45}
.body p{margin:0 0 9px;text-align:justify}
.ttd{display:flex;align-items:flex-start;margin-top:6px;position:relative}
.ttd>div{width:160px;margin-right:20px;position:relative;z-index:1}
.stamp{position:absolute;top:0;width:130px;height:auto;transform:translateX(-50%);z-index:0;opacity:.92}

.fl{font-size:13px;margin:4px 0}.fl button{padding:2px 8px;font-size:12px;margin-left:6px}

.sig{height:68px;display:flex;align-items:flex-end}
.sig img{max-height:68px;max-width:150px;object-fit:contain}
.ttd b{text-decoration:underline;display:block}
.foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:700;font-style:italic;color:#1f3a73;font-size:16px}
#stage{position:fixed;left:-10000px;top:0}
</style>
</head>
<body>
<div class="wrap">
<div>
<h1>Generator Surat PMII</h1>
<p class="sub">Isi form, lihat pratinjau, lalu unduh sebagai PDF. Tanda <span style="color:var(--err)">*</span> wajib diisi.</p>
<form id="f" novalidate>
<div class="card"><h2>Data Surat</h2>
<label class="req" for="no">Nomor surat</label><input type="text" id="no" placeholder="185 PR-XVI.V-03.01.01.A-1.09.2026">
<label class="req">Lampiran <small>(jumlah lembar)</small></label>
<div class="step"><button type="button" id="mn" aria-label="Kurangi">−</button><input type="number" id="lamp" value="1" min="1" max="99"><button type="button" id="pl" aria-label="Tambah">+</button></div>
<label class="req" for="hal">Hal</label><input type="text" id="hal" value="UNDANGAN">
<label class="req" for="tuj">Kepada Yth.</label><input type="text" id="tuj" placeholder="Sahabat Erika Dwi">
<label class="req" for="tgl">Tanggal pembuatan surat</label><input type="date" id="tgl">
<label for="att">File lampiran <small>(opsional, PDF atau gambar, boleh lebih dari satu)</small></label><input type="file" id="att" accept="application/pdf,image/*" multiple><div id="atl"></div>
<small style="color:var(--mut)">File lampiran digabung di halaman setelah surat pada PDF hasil.</small>
</div>
<div class="card"><h2>Acara <small style="font-weight:400;color:var(--mut)">(opsional)</small></h2>
<label for="acr">Nama acara</label><input type="text" id="acr" placeholder="RTAR (Rapat Tahunan Anggota Rayon)">
<label for="tma">Tema acara</label><input type="text" id="tma" placeholder="Meneguhkan Intelektualitas, ...">
<label for="hri">Hari/Tanggal</label><input type="date" id="hri">
<label for="wkt">Waktu</label><input type="text" id="wkt" placeholder="07:00 s/d 20:30">
<label for="tpt">Tempat</label><input type="text" id="tpt" placeholder="Aula ASPI PMII Cabang Ciputat">
<label for="lnk">Tautan lokasi</label><input type="text" id="lnk" placeholder="https://maps.app.goo.gl/...">
</div>
<div class="card"><h2>Penandatangan</h2><div id="sgs"></div>
<button type="button" id="add">+ Tambah penandatangan</button></div>
<button class="pri" type="submit" id="dl">Unduh PDF</button>
<p class="err" id="err" role="alert"></p>
</form>
</div>
<div>
<p class="pvh">Pratinjau</p>
<div class="pv" id="pv"><div class="paper" id="paper"></div></div>
</div>
</div>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

async function toPng(f){const u=URL.createObjectURL(f);const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r),"image/png"))}
async function mergeAtt(buf){
 const {PDFDocument}=PDFLib;const doc=await PDFDocument.load(buf);
 for(const f of atts){
  if(f.type==="application/pdf"){const src=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});(await doc.copyPages(src,src.getPageIndices())).forEach(p=>doc.addPage(p))}
  else{
   let img;const ab=await f.arrayBuffer();
   if(f.type==="image/jpeg")img=await doc.embedJpg(ab);else if(f.type==="image/png")img=await doc.embedPng(ab);else img=await doc.embedPng(await toPng(f));
   const W=595.28,H=841.89,m=36,k=Math.min((W-2*m)/img.width,(H-2*m)/img.height,1),w=img.width*k,h=img.height*k;
   doc.addPage([W,H]).drawImage(img,{x:(W-w)/2,y:(H-h)/2,width:w,height:h});
  }
 }
 return await doc.save();
}
